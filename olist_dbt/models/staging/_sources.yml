version: 2

# Raw Olist CSVs read in place by DuckDB (no load step). Every column is read
# as text; typing happens explicitly in the staging models, so a malformed value
# fails the build loudly instead of being silently inferred.
sources:
  - name: olist_raw
    description: >
      Brazilian E-Commerce Public Dataset by Olist (github.com/olist/work-at-olist-data,
      also on Kaggle under CC BY-NC-SA 4.0). Downloaded by data/download_data.py.
    tables:
      - name: customers
        description: One row per customer_id; customer_unique_id identifies the person.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_customers_dataset.csv', header=true, all_varchar=true)"}
      - name: orders
        description: One row per order, status and lifecycle timestamps.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_orders_dataset.csv', header=true, all_varchar=true)"}
      - name: order_items
        description: One row per order line (order_id, order_item_id).
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_order_items_dataset.csv', header=true, all_varchar=true)"}
      - name: order_payments
        description: One row per payment record of an order.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_order_payments_dataset.csv', header=true, all_varchar=true)"}
      - name: order_reviews
        description: Customer satisfaction survey answers (1-5 stars); some orders have several.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_order_reviews_dataset.csv', header=true, all_varchar=true)"}
      - name: products
        description: Product catalogue with Portuguese category names.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_products_dataset.csv', header=true, all_varchar=true)"}
      - name: sellers
        description: Seller location.
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/olist_sellers_dataset.csv', header=true, all_varchar=true)"}
      - name: category_translation
        description: Portuguese to English category names (file starts with a UTF-8 BOM).
        meta: {external_location: "read_csv('{{ var('raw_dir') }}/product_category_name_translation.csv', header=true, all_varchar=true)"}
